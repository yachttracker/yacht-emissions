name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
      DATABASE_SSL: "false"
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Syntaxprüfung
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Sicherheitsprüfung Abhängigkeiten (high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Server starten und /health prüfen
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then echo; exit 0; fi
            sleep 1
          done
          echo "Server antwortet nicht:"; cat server.log; exit 1
      - name: API-Tests (Zeitfenster, Maskierung, Admin-Schutz)
        run: node --test --test-reporter=spec test/api.test.js
      - name: Emissionsberechnung v3 (Rechenbeispiel) und Neuberechnungsskript
        run: node --test --test-reporter=spec test/emissions.test.js test/recompute.test.js test/specs.test.js
      - name: Abruflogik (Teilabrufe, Credit-Zähler, maskierte Historie, Rückwärtsabruf)
        shell: bash
        run: |
          set -o pipefail
          if ! node --test --test-reporter=spec test/planner.test.js 2>&1 | tee planner.out; then
            # Fehlerausgabe zusätzlich als Annotation (lesbar über die Checks-API ohne Log-Zugriff)
            msg=$(grep -v '^\s*$' planner.out | tail -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=planner.test.js::${msg}"
            exit 1
          fi
      - name: Identitätsabgleich über die IMO (neue MMSI, ruhende Yacht, fremde MMSI, kein AIS)
        shell: bash
        run: |
          set -o pipefail
          if ! node --test --test-reporter=spec test/identity.test.js 2>&1 | tee identity.out; then
            msg=$(grep -v '^\s*$' identity.out | tail -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=identity.test.js::${msg}"
            exit 1
          fi
      - name: Tracking-Zustand (Pause, Lebenszeichen, Wiederaufnahme, Prüfliste)
        shell: bash
        run: |
          set -o pipefail
          if ! node --test --test-reporter=spec test/tracking.test.js 2>&1 | tee tracking.out; then
            msg=$(grep -v '^\s*$' tracking.out | tail -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=tracking.test.js::${msg}"
            exit 1
          fi
      - name: Backup-Skripte testen (Dump, Upload-Ersatz, Aufbewahrung, Rückspielen)
        run: TEST_ADMIN_URL=postgresql://postgres:ci@localhost:5432/postgres bash backup/test/run-test.sh
      - name: Backup-Skripte mit shellcheck prüfen (nur Hinweis)
        continue-on-error: true
        run: shellcheck backup/backup.sh backup/restore.sh backup/test/run-test.sh backup/test/stub/aws
